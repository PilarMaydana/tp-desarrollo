server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:capitalhumano;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Argentina/Buenos_Aires

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/seed.sql

  h2:
    console:
      enabled: true
      path: /h2-console

  # Deshabilitar autoconfiguración de LDAP embebido hasta que se configure en el CU 01
  ldap:
    embedded:
      port: 0

springdoc:
  swagger-ui:
    enabled: true

capitalhumano:
  evaluacion:
    tiempo-maximo-minutos: 60
    cantidad-preguntas-por-bloque: 5
  cuestionario:
    instrucciones: >-
      Lea atentamente cada pregunta y seleccione la opción que mejor refleje su criterio.
      El cuestionario está organizado en bloques; deberá responder todas las preguntas de cada
      bloque para poder avanzar al siguiente. Una vez iniciado, dispondrá del tiempo máximo
      indicado para completarlo.
    max-accesos: 3
    max-horas-en-estado-activo: 72

