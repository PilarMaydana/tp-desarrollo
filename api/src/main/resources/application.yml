server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/capitalhumano}
    username: ${DB_USER:capitalhumano}
    password: ${DB_PASSWORD:capitalhumano}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Argentina/Buenos_Aires

  # Deshabilitar autoconfiguración de LDAP embebido hasta que se configure en el CU 01
  ldap:
    embedded:
      port: 0

springdoc:
  swagger-ui:
    enabled: true
